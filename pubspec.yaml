name: waylight_mobile
description: Waylight for Android and iOS, the companion app of the self-hosted start page.
publish_to: none
# Managed by release-please; do not edit by hand (see docs/releasing.md).
version: 0.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Every runtime dependency needs a reason (docs/adr/0003-dependency-policy.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Secrets (session, CSRF token) in the Keychain / Android Keystore.
  flutter_secure_storage: ^11.2.0
  # Declarative routing with redirects and deep links; maintained by the Flutter team.
  go_router: ^18.1.4
  # Minimal HTTP client from the Dart team; no interceptors needed.
  http: ^1.6.0
  # Required by flutter gen-l10n for plurals, dates and numbers.
  intl: ^0.20.3
  # Hierarchical loggers from the Dart team instead of print().
  logging: ^1.3.0
  # Material widgets, decoupled from the framework since Flutter 3.50.
  material_ui: ^1.11.1
  # Dependency injection of repositories and view models (official architecture guide).
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
