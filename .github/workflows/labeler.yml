name: Labeler

# Adds area labels to pull requests from the files they change
# (.github/labeler.yml). Runs with pull_request_target to label pull requests
# from forks too; it never checks out or runs their code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
