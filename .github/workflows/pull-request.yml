name: Pull request

# Checks of the pull request itself, not of the code: the title becomes the
# squash commit on main and with it the changelog (docs/workflow.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The subject "{subject}" must start with a lower-case letter and
            must not end with a full stop, e.g. "feat(auth): sign in with a passkey".

  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    # Dependabot and release-please open pull requests without an issue.
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'release-please--')
    steps:
      - name: The description closes an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +([a-z0-9_.-]+/[a-z0-9_.-]+)?#[0-9]+'; then
            echo "::error::Link the issue in the description, e.g. 'Closes #12' (CONTRIBUTING.md)."
            exit 1
          fi

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
