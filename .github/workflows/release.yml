name: Release

# release-please keeps a release pull request open that collects the
# Conventional Commits on main, bumps the version in pubspec.yaml and writes
# CHANGELOG.md. Merging it tags the version and creates the GitHub release,
# to which the builds below are attached (docs/releasing.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets cannot be tested in a step condition directly; only this
      # boolean is exposed, never the secret itself.
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # Signs the release APK with the fixed release key (#284); a release
      # signed with a changing debug key could never be updated.
      - name: Provide the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n ${!v} ]] || { echo "::error::Secret ANDROID_${v} is missing (docs/releasing.md)"; exit 1; }
          done
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "waylight-${TAG}.apk"
          gh release upload "$TAG" "waylight-${TAG}.apk" --clobber
      # Google Play upload (#25): runs only when the service account secret
      # exists. The bundle is signed with the same key as the APK, which
      # then acts as the Play upload key (docs/releasing.md).
      - name: Build the app bundle
        if: env.PLAY_UPLOAD == 'true'
        run: flutter build appbundle --release
      - name: Upload the bundle to the internal track
        if: env.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.waylight.mobile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # The Wear OS app (ADR 0015) carries the same version from pubspec.yaml
  # and is attached to the same release.
  wear:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Signed with the debug key until release signing is set up (#25),
      # like the phone APK.
      # Signs the watch APK with the fixed release key (#284); a release
      # signed with a changing debug key could never be updated.
      - name: Provide the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n ${!v} ]] || { echo "::error::Secret ANDROID_${v} is missing (docs/releasing.md)"; exit 1; }
          done
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon assembleRelease
      - name: Attach the watch APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cp build/outputs/apk/release/waylight-wear-release.apk "waylight-wear-${TAG}.apk"
          gh release upload "$TAG" "waylight-wear-${TAG}.apk" --clobber
