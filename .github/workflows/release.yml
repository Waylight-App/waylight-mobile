name: Release

# release-please keeps a release pull request open that collects the
# Conventional Commits on main, bumps the version in pubspec.yaml and writes
# CHANGELOG.md. Merging it tags the version and creates the GitHub release,
# to which the builds below are attached (docs/releasing.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # Until store signing is set up (see ROADMAP.md), the APK is signed
      # with the debug key: fine for testers, not for the stores.
      # The Firebase options of the project (ADR 0008, #178); without the
      # secrets, e.g. in forks, the store APK builds without push.
      - run: flutter build apk --release --flavor store
        env:
          WAYLIGHT_FCM_PROJECT_ID: ${{ secrets.WAYLIGHT_FCM_PROJECT_ID }}
          WAYLIGHT_FCM_APP_ID: ${{ secrets.WAYLIGHT_FCM_APP_ID }}
          WAYLIGHT_FCM_API_KEY: ${{ secrets.WAYLIGHT_FCM_API_KEY }}
          WAYLIGHT_FCM_SENDER_ID: ${{ secrets.WAYLIGHT_FCM_SENDER_ID }}
      - run: flutter build apk --release --flavor fdroid
      - name: Attach the APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cp build/app/outputs/flutter-apk/app-store-release.apk "waylight-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-fdroid-release.apk "waylight-${TAG}-fdroid.apk"
          gh release upload "$TAG" "waylight-${TAG}.apk" "waylight-${TAG}-fdroid.apk" --clobber
