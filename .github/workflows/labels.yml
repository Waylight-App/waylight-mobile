name: Labels

# Creates and updates the repository labels from .github/labels.yml. Labels
# that are not in the file are kept: GitHub's defaults and labels added by
# hand stay usable. A pull request that changes the file gets a dry run.
on:
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  pull_request:
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
          dry-run: ${{ github.event_name == 'pull_request' }}
