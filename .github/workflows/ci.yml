name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels the superseded run. Pushes to main are
# never cancelled: every commit there keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, generated files, analysis, tests and coverage: `make ci`.
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: make ci FLUTTER=flutter DART=dart
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  # The app must still build for Android. The iOS app is built locally on
  # the maintainer's Mac (#171); no workflow runs on macOS.
  android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # One APK without Google services (ADR 0008, #205); the check keeps
      # Firebase and Play services from coming back through a dependency.
      - run: flutter build apk --debug
      - name: The APK contains no Google services
        run: |
          if unzip -p build/app/outputs/flutter-apk/app-debug.apk 'classes*.dex' | grep -aqE 'com/google/(firebase|android/gms)'; then
            echo "::error::The APK contains Firebase or Play services classes (ADR 0008)."
            exit 1
          fi
      # Test builds for real devices without a local Gradle build (#282).
      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waylight-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # The Wear OS app is a Gradle build of its own in wear/ (ADR 0015); it
  # needs no Flutter SDK and runs next to the other jobs.
  wear:
    name: Build Wear OS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle and checks wear/gradle/wrapper/gradle-wrapper.jar
      # against the checksums Gradle publishes.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The release build runs R8, which the release workflow relies on.
      - run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest
      - name: The watch APK contains no Google services
        # grep reads the whole dex (no -q), so an early exit cannot hide a
        # match behind a broken pipe.
        run: |
          apk=$(ls build/outputs/apk/debug/*.apk)
          matches=$(unzip -p "$apk" 'classes*.dex' | grep -acE 'com/google/(firebase|android/gms)' || true)
          if [ "$matches" != "0" ]; then
            echo "::error::The watch APK contains Firebase or Play services classes (ADR 0015)."
            exit 1
          fi
      - name: Keep the watch APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waylight-wear-debug-apk
          # upload-artifact ignores defaults.run.working-directory.
          path: wear/build/outputs/apk/debug/*.apk
          retention-days: 14
