name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels the superseded run. Pushes to main are
# never cancelled: every commit there keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, generated files, analysis, tests and coverage: `make ci`.
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: make ci FLUTTER=flutter DART=dart
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  # The app must still build for Android. The iOS app is built locally on
  # the maintainer's Mac (#171); no workflow runs on macOS.
  android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # One APK without Google services (ADR 0008, #205); the check keeps
      # Firebase and Play services from coming back through a dependency.
      - run: flutter build apk --debug
      - name: The APK contains no Google services
        run: |
          if unzip -p build/app/outputs/flutter-apk/app-debug.apk 'classes*.dex' | grep -aqE 'com/google/(firebase|android/gms)'; then
            echo "::error::The APK contains Firebase or Play services classes (ADR 0008)."
            exit 1
          fi
