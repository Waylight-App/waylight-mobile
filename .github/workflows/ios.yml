name: iOS

# Builds the iOS app when native iOS code changes, and on demand. macOS
# minutes count ten times against the monthly Actions quota of this private
# repository, so there is no schedule and no run for Dart-only changes;
# those are covered by the Android build in CI.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    # Bounds the cost of a stuck run (a minute here is ten of the quota).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # Debug is enough to compile Swift, the extensions and the plugins;
      # signing follows with the store setup (#25).
      - run: flutter build ios --debug --no-codesign
