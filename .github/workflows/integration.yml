name: Integration

# End-to-end tests on an Android emulator against a real Waylight server
# (docs/testing.md#integration-tests). They take minutes and depend on the
# server, so they run nightly and on demand, not on every pull request.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Waylight server to test against
        default: https://demo.getwaylight.app

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: true

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The public demo: HTTPS, example data, reset every hour.
      WAYLIGHT_URL: ${{ inputs.url || 'https://demo.getwaylight.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # The runner image ships toolchains this job does not use; without
      # removing some of them the emulator cannot create its data partition.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          cores: 4
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: flutter test integration_test --dart-define=WAYLIGHT_URL=$WAYLIGHT_URL
