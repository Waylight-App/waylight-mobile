name: Task
description: Technical work without a visible change (refactoring, tooling, docs)
type: Task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be different afterwards, and why?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Files to touch, links, open questions.
