version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    labels: [dependencies]
    groups:
      # One pull request for all patch and minor updates; majors stay single.
      packages:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci }
    labels: [dependencies, "area: ci"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    commit-message: { prefix: build, include: scope }
    labels: [dependencies, "area: android"]
