<!doctype html>
<!-- Mockup of the Waylight app (docs/design/README.md). Static HTML, not app code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two-factor code</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#3365E8}a:hover{color:#1F4FC9}
</style>
</head>
<body style="margin: 0; background: #E3E1E9">
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; color: #1A1B21; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; display: flex; align-items: center; padding: 8px 4px 0">
    <a href="sign-in.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #1A1B21">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
  </header>

  <section style="padding: 16px 24px 32px; display: flex; flex-direction: column; flex: 1">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #DCE1FF; color: #00174B; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
    </div>

    <h1 style="margin: 24px 0 0; font-size: 28px; line-height: 36px; font-weight: 400">Two-factor code</h1>
    <p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; color: #45464F">Enter the 6-digit code from your authenticator app for anna on home.example.org.</p>

    <div style="margin-top: 32px; position: relative">
      <label for="code" style="position: absolute; top: -9px; left: 12px; padding: 0 4px; background: #FAF8FF; font-size: 12px; line-height: 16px; color: #3365E8">Code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" value="482 913" style="box-sizing: border-box; width: 100%; height: 64px; padding: 0 16px; border: 2px solid #3365E8; border-radius: 4px; background: transparent; font: 500 28px 'Roboto Mono', ui-monospace, monospace; letter-spacing: 6px; color: #1A1B21; outline: none">
    </div>
    <p style="margin: 6px 16px 0; font-size: 12px; line-height: 16px; color: #45464F">Filled in automatically when your password manager has it.</p>

    <a href="dashboard.html" style="margin-top: 32px; height: 48px; border-radius: 24px; background: #3365E8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; letter-spacing: 0.1px; text-decoration: none">Verify</a>
    <a href="#" style="margin-top: 8px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; text-decoration: none">Use a recovery code instead</a>
  </section>
</main>
</body>
</html>
