<!doctype html>
<!-- Mockup of the Waylight app (docs/design/README.md). Static HTML, not app code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9C5D00}a:hover{color:#7E5700}
</style>
</head>
<body style="margin: 0; background: #ECE1D4">
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F3; color: #201B13; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 8px 4px 0">
    <a href="dashboard.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #201B13">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">Settings</h1>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column">
    <h2 style="margin: 0; padding: 16px 16px 4px; font-size: 14px; line-height: 20px; font-weight: 500; color: #9C5D00">Server</h2>
    <div style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 16px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#504535" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg>
      <div style="flex: 1">
        <p style="margin: 0; font-size: 16px; line-height: 24px">home.example.org</p>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #504535">Connected over HTTPS</p>
      </div>
    </div>
    <a href="connect.html" style="display: flex; align-items: center; min-height: 56px; padding: 0 16px 0 56px; font-size: 16px; color: #201B13; text-decoration: none">Use another server</a>

    <h2 style="margin: 0; padding: 16px 16px 4px; font-size: 14px; line-height: 20px; font-weight: 500; color: #9C5D00; border-top: 1px solid #D4C4AF">Account</h2>
    <div style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 16px">
      <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; background: #FEDAA3; color: #3E2A00; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">A</span>
      <div style="flex: 1">
        <p style="margin: 0; font-size: 16px; line-height: 24px">anna</p>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #504535">Member · two-factor on</p>
      </div>
    </div>
    <a href="sign-in.html" style="display: flex; align-items: center; min-height: 56px; padding: 0 16px 0 56px; font-size: 16px; color: #BA1A1A; text-decoration: none">Sign out</a>

    <h2 style="margin: 0; padding: 16px 16px 4px; font-size: 14px; line-height: 20px; font-weight: 500; color: #9C5D00; border-top: 1px solid #D4C4AF">Appearance</h2>
    <div style="padding: 8px 16px 12px 56px; display: flex; flex-direction: column; gap: 8px">
      <span id="theme-label" style="font-size: 16px; line-height: 24px">Theme</span>
      <div role="group" aria-labelledby="theme-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #827563; border-radius: 20px; overflow: hidden">
        <button type="button" aria-pressed="true" style="height: 40px; border: 0; font: 500 14px Roboto, system-ui, sans-serif; background: #FEDAA3; color: #3E2A00;">✓ System</button>
          <button type="button" aria-pressed="false" style="height: 40px; border: 0; font: 500 14px Roboto, system-ui, sans-serif; border-left: 1px solid #827563; background: transparent; color: #201B13;">Light</button>
          <button type="button" aria-pressed="false" style="height: 40px; border: 0; font: 500 14px Roboto, system-ui, sans-serif; border-left: 1px solid #827563; background: transparent; color: #201B13;">Dark</button>
      </div>
    </div>
    <a href="#" style="display: flex; align-items: center; min-height: 64px; padding: 0 16px 0 56px; color: #201B13; text-decoration: none">
      <span style="flex: 1"><span style="display: block; font-size: 16px; line-height: 24px">Language</span><span style="display: block; font-size: 14px; line-height: 20px; color: #504535">System (English)</span></span>
    </a>

    <h2 style="margin: 0; padding: 16px 16px 4px; font-size: 14px; line-height: 20px; font-weight: 500; color: #9C5D00; border-top: 1px solid #D4C4AF">About</h2>
    <div style="display: flex; align-items: center; min-height: 56px; padding: 0 16px 0 56px">
      <span style="flex: 1; font-size: 16px">Version</span><span style="font-size: 14px; color: #504535">0.1.0 (1)</span>
    </div>
    <a href="#" style="display: flex; align-items: center; min-height: 48px; padding: 0 16px 0 56px; font-size: 16px; color: #201B13; text-decoration: none">Source code and licence (MIT)</a>
    <a href="#" style="display: flex; align-items: center; min-height: 48px; padding: 0 16px 0 56px; font-size: 16px; color: #201B13; text-decoration: none">Privacy</a>
    <a href="#" style="display: flex; align-items: center; min-height: 48px; padding: 0 16px 0 56px; font-size: 16px; color: #201B13; text-decoration: none">Open-source licences</a>
  </div>
</main>
</body>
</html>
