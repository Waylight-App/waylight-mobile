<!doctype html>
<!-- Mockup of the Waylight app (docs/design/README.md). Static HTML, not app code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home screen as a grid of sizes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9C5D00}a:hover{color:#7E4A00}
</style>
</head>
<body style="margin: 0; background: #E3E1E9">
<main style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F3; color: #201B13; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 64px; display: flex; align-items: center; padding: 8px 4px 0 16px; gap: 4px">
    <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; flex: 1">Waylight</span>
    <a href="home-edit.html" aria-label="Arrange this tab" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #504535">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="18" height="8" rx="2"></rect></svg>
    </a>
    <a href="search.html" aria-label="Search" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #504535">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </a>
    <a href="settings.html" aria-label="Settings" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #504535">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
    </a>
  </header>

  <nav aria-label="Tabs" style="display: flex; border-bottom: 1px solid #D4C4AF; padding: 0 8px">
    <a href="#" aria-current="page" style="height: 48px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #9C5D00; text-decoration: none; border-bottom: 3px solid #9C5D00; box-sizing: border-box">Home</a>
    <a href="#" style="height: 48px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #504535; text-decoration: none">Server</a>
    <a href="#" style="height: 48px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #504535; text-decoration: none">Family</a>
    <a href="#" style="height: 48px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #504535; text-decoration: none">News</a>
  </nav>

  <div style="flex: 1; padding: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 12px; align-content: start">
    <section aria-label="Clock, small" style="grid-column: span 2; grid-row: span 2; border-radius: 22px; background: #F8ECDF; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-size: 12px; font-weight: 500; color: #504535">Wednesday</span>
      <span style="font-size: 44px; line-height: 48px; letter-spacing: -1px">14:32</span>
      <span style="font-size: 13px; color: #504535">18 November</span>
    </section>

    <section aria-label="Weather, small" style="grid-column: span 2; grid-row: span 2; border-radius: 22px; background: #FEDAA3; color: #3E2A00; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-size: 12px; font-weight: 500">Berlin</span>
      <div style="display: flex; align-items: center; gap: 6px">
        <span style="font-size: 44px; line-height: 48px">8°</span>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.6 10 3.5 3.5 0 0 1 17 17z"></path><path d="M9 20l-1 2M13 20l-1 2M17 20l-1 2"></path></svg>
      </div>
      <span style="font-size: 13px">Light rain · H 10° L 4°</span>
    </section>

    <section aria-label="To-dos, medium" style="grid-column: span 4; grid-row: span 2; border-radius: 22px; background: #F8ECDF; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: baseline">
        <h2 style="margin: 0; flex: 1; font-size: 15px; font-weight: 500">To-dos</h2>
        <span style="font-size: 12px; color: #504535">3 open</span>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #9C5D00; margin: 0"> Buy milk</label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #9C5D00; margin: 0"> Renew the domain <span style="margin-left: auto; font-size: 12px; color: #A1351D; font-weight: 500">today</span></label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #9C5D00; margin: 0"> Book the dentist</label>
    </section>

    <section aria-label="Calendar, small" style="grid-column: span 2; grid-row: span 2; border-radius: 22px; background: #F8ECDF; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 500; color: #9C5D00">TODAY</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 20px">Parents' evening</span>
      <span style="font-size: 13px; color: #504535">18:30 – 20:00</span>
      <span style="margin-top: auto; font-size: 12px; color: #504535">+2 more tomorrow</span>
    </section>

    <section aria-label="Departures, small" style="grid-column: span 2; grid-row: span 2; border-radius: 22px; background: #F8ECDF; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 500; color: #504535">Hauptstraße</span>
      <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 28px; font-weight: 500">9</span><span style="font-size: 13px; color: #504535">min</span></div>
      <span style="font-size: 14px; line-height: 18px">S1 Hauptbahnhof</span>
      <span style="margin-top: auto; font-size: 12px; color: #504535">then 14:53, 15:01</span>
    </section>

    <section aria-label="Status, strip" style="grid-column: span 4; grid-row: span 1; border-radius: 22px; background: #F8ECDF; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 14px">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #2E6B30"></span>
      <span style="flex: 1"><strong style="font-weight: 500">All 12 services up</strong> · backup 03:00</span>
      <span style="font-size: 12px; color: #504535">1 min</span>
    </section>

    <section aria-label="Bookmarks, medium" style="grid-column: span 4; grid-row: span 2; border-radius: 22px; background: #F8ECDF; padding: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 12px">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #201B13; text-decoration: none"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FFF8F3; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #9C5D00">C</span>Cloud</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #201B13; text-decoration: none"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FFF8F3; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #9C5D00">M</span>Media</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #201B13; text-decoration: none"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FFF8F3; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #9C5D00">H</span>Home</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #201B13; text-decoration: none"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FFF8F3; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #9C5D00">R</span>Router</a>
    </section>
  </div>

  <a href="capture.html" style="position: absolute; right: 16px; bottom: 24px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; background: #F2B441; color: #1A1206; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; text-decoration: none; box-shadow: 0 3px 6px rgba(0,0,0,0.18)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Capture
  </a>
</main>
</body>
</html>
