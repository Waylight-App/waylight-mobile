<!doctype html>
<!-- Mockup of the Waylight app (docs/design/README.md). Static HTML, not app code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3365E8}a:hover{color:#1F4FC9}
</style>
</head>
<body style="margin: 0; background: #E3E1E9">
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; color: #1A1B21; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 8px 4px 0">
    <a href="connect.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #1A1B21">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
  </header>

  <section style="padding: 16px 24px 32px; display: flex; flex-direction: column; flex: 1">
    <div style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #C5C6D0; font-size: 14px; font-weight: 500; color: #45464F">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E6B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      home.example.org
    </div>

    <h1 style="margin: 24px 0 0; font-size: 28px; line-height: 36px; font-weight: 400">Sign in</h1>
    <p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; color: #45464F">With the account you use in the browser.</p>

    <div style="margin-top: 32px; position: relative">
      <label for="account" style="position: absolute; top: -9px; left: 12px; padding: 0 4px; background: #FAF8FF; font-size: 12px; line-height: 16px; color: #45464F">Account name</label>
      <input id="account" autocomplete="username" value="anna" style="box-sizing: border-box; width: 100%; height: 56px; padding: 0 16px; border: 1px solid #757780; border-radius: 4px; background: transparent; font: 400 16px Roboto, system-ui, sans-serif; color: #1A1B21">
    </div>

    <div style="margin-top: 24px; position: relative">
      <label for="password" style="position: absolute; top: -9px; left: 12px; padding: 0 4px; background: #FAF8FF; font-size: 12px; line-height: 16px; color: #3365E8">Password</label>
      <input id="password" type="password" autocomplete="current-password" value="correct-horse" style="box-sizing: border-box; width: 100%; height: 56px; padding: 0 56px 0 16px; border: 2px solid #3365E8; border-radius: 4px; background: transparent; font: 400 16px Roboto, system-ui, sans-serif; color: #1A1B21; outline: none">
      <button type="button" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #45464F; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>

    <a href="two-factor.html" style="margin-top: 32px; height: 48px; border-radius: 24px; background: #3365E8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; letter-spacing: 0.1px; text-decoration: none">Sign in</a>
    <a href="#" style="margin-top: 8px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; text-decoration: none">Forgot your password?</a>

    <div style="flex: 1"></div>
    <p style="margin: 0 0 8px; font-size: 12px; line-height: 16px; color: #45464F; text-align: center">After repeated wrong passwords the server locks sign-in for 15 minutes, as in the browser.</p>
    <a href="connect.html" style="height: 48px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; text-decoration: none">Use another server</a>
  </section>
</main>
</body>
</html>
