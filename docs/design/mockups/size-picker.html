<!doctype html>
<!-- Mockup of the Waylight app (docs/design/README.md). Static HTML, not app code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose the size of a widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9C5D00}a:hover{color:#7E4A00}
</style>
</head>
<body style="margin: 0; background: #E3E1E9">
<main style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F3; color: #201B13; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <div aria-hidden="true" style="padding: 80px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 12px">
    <div style="grid-column: span 2; grid-row: span 2; border-radius: 22px; background: #F8ECDF"></div>
    <div style="grid-column: span 2; grid-row: span 2; border-radius: 22px; background: #F8ECDF"></div>
    <div style="grid-column: span 4; grid-row: span 2; border-radius: 22px; background: #F8ECDF"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32)"></div>

  <section role="dialog" aria-label="Size of the to-do widget" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: #FFF8F3; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #827562; margin: 14px 0 2px"></span>
    <h2 style="margin: 0 8px; font-size: 22px; line-height: 28px; font-weight: 400">To-dos</h2>

    <div style="height: 372px; border-radius: 20px; background: #F3E6D8; padding: 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 12px; align-content: center">
      
      
      
        <div style="grid-column: span 4; grid-row: span 4; border-radius: 22px; background: #F8ECDF; padding: 12px 14px; display: flex; flex-direction: column; gap: 0; font-size: 14px">
          <span style="font-size: 13px; font-weight: 500; margin-bottom: 4px">To-dos · 3 open</span>
          <span style="min-height: 34px; display: flex; align-items: center">☐  Buy milk</span>
          <span style="min-height: 34px; display: flex; align-items: center">☐  Renew the domain</span>
          <span style="min-height: 34px; display: flex; align-items: center">☐  Book the dentist</span>
          <span style="min-height: 34px; display: flex; align-items: center; color: #504535; text-decoration: line-through">☑  Call the plumber</span>
          <span style="min-height: 34px; display: flex; align-items: center; color: #504535; text-decoration: line-through">☑  Water the plants</span>
          <span style="margin-top: auto; height: 40px; border-radius: 20px; background: #FFF8F3; display: flex; align-items: center; padding: 0 14px; color: #504535">+ Add a to-do</span>
        </div>
      
      
    </div>

    <div role="radiogroup" aria-label="Size" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button type="button" role="radio" aria-checked="false" style="height: 72px; border-radius: 16px; border: 1px solid #D4C4AF; background: transparent; color: #201B13; font: 500 13px Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
          <span aria-hidden="true" style="display: block; width: 12px; height: 12px; border-radius: 4px; background: #827562;"></span>
          Small
        </button>
      
<button type="button" role="radio" aria-checked="false" style="height: 72px; border-radius: 16px; border: 1px solid #D4C4AF; background: transparent; color: #201B13; font: 500 13px Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
          <span aria-hidden="true" style="display: block; width: 24px; height: 12px; border-radius: 4px; background: #827562;"></span>
          Medium
        </button>
      
<button type="button" role="radio" aria-checked="true" style="height: 72px; border-radius: 16px; border: 2px solid #9C5D00; background: #FEDAA3; color: #3E2A00; font: 500 13px Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
          <span aria-hidden="true" style="display: block; width: 24px; height: 24px; border-radius: 4px; background: #9C5D00;"></span>
          Large
        </button>
      
<button type="button" role="radio" aria-checked="false" style="height: 72px; border-radius: 16px; border: 1px solid #D4C4AF; background: transparent; color: #201B13; font: 500 13px Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
          <span aria-hidden="true" style="display: block; width: 24px; height: 6px; border-radius: 4px; background: #827562;"></span>
          Strip
        </button>
      
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #827562; background: transparent; color: #201B13; font: 500 14px Roboto, sans-serif; cursor: pointer">Hide on phones</button>
      <a href="home-edit.html" style="flex: 1; height: 48px; border-radius: 24px; background: #F2B441; color: #1A1206; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; text-decoration: none">Done</a>
    </div>
  </section>
</main>
</body>
</html>
