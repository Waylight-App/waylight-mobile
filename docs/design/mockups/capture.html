<!doctype html>
<!-- Mockup of the Waylight app (docs/design/README.md). Static HTML, not app code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save to Waylight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9C5D00}a:hover{color:#7E5700}
</style>
</head>
<body style="margin: 0; background: #ECE1D4">
<main style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F3; color: #201B13; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <div aria-hidden="true" style="padding: 24px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 40px; width: 140px; border-radius: 8px; background: #F8ECDF"></div>
    <div style="height: 120px; border-radius: 16px; background: #F8ECDF"></div>
    <div style="height: 200px; border-radius: 16px; background: #F8ECDF"></div>
    <div style="height: 120px; border-radius: 16px; background: #F8ECDF"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32)"></div>

  <section role="dialog" aria-label="Save to Waylight" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: #FEF2E5; padding: 8px 24px 32px; display: flex; flex-direction: column; gap: 20px">
    <span aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #827563; margin: 14px 0 2px"></span>
    <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">Save to Waylight</h2>

    <div style="display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: #FFF8F3; border: 1px solid #D4C4AF">
      <span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #FEDAA3; color: #3E2A00; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
      </span>
      <div style="min-width: 0">
        <p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Growing tomatoes on a balcony</p>
        <p style="margin: 0; font-size: 12px; line-height: 16px; color: #504535; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">example.org/garden/balcony-tomatoes</p>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #504535">Save as</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #827563; background: transparent; color: #504535; font: 500 14px Roboto, system-ui, sans-serif">To-do</button>
            <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #827563; background: transparent; color: #504535; font: 500 14px Roboto, system-ui, sans-serif">Note</button>
            <button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px 0 10px; border-radius: 8px; border: 0; background: #FEDAA3; color: #3E2A00; font: 500 14px Roboto, system-ui, sans-serif; display: flex; align-items: center; gap: 6px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
              Read later
            </button>
            <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #827563; background: transparent; color: #504535; font: 500 14px Roboto, system-ui, sans-serif">Bookmark</button>
      </div>
    </fieldset>

    <div style="position: relative">
      <label for="title" style="position: absolute; top: -9px; left: 12px; padding: 0 4px; background: #FEF2E5; font-size: 12px; line-height: 16px; color: #504535">Title</label>
      <input id="title" value="Growing tomatoes on a balcony" style="box-sizing: border-box; width: 100%; height: 56px; padding: 0 16px; border: 1px solid #827563; border-radius: 4px; background: transparent; font: 400 16px Roboto, system-ui, sans-serif; color: #201B13">
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <a href="dashboard.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none">Cancel</a>
      <a href="dashboard.html" style="height: 40px; padding: 0 24px; border-radius: 20px; background: #F2B441; color: #1A1206; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none">Save</a>
    </div>
  </section>
</main>
</body>
</html>
